name: Typermonitor — sprawdzanie profili

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Jedno uruchomienie naraz, żeby dwa przebiegi nie nadpisywały sobie stanu.
concurrency:
  group: typermonitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sprawdź profile
        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      # always(): stan zapisujemy także wtedy, gdy któryś profil zwrócił błąd,
      # żeby wysłane już alerty nie powtarzały się przy kolejnym przebiegu.
      - name: Zapisz stan
        if: always()
        run: |
          git config user.name "typermonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja stanu monitora"
            git pull --rebase --autostash
            git push
          fi
